apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnitide-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnitide
  template:
    metadata:
      labels:
        app: omnitide
    spec:
      containers:
      - name: omnitide
        image: omnitide:latest
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:27017"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /docs
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: omnitide-service
spec:
  type: NodePort
  selector:
    app: omnitide
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
