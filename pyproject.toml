[project]
name = "duo-monorepo"
version = "0.1.0"
description = "Unified, AI-powered, multi-agent monorepo (ExWork, Scribe, Omnitide, etc.)"
authors = [
    {name = "mrpongalfer", email = "pongalfer@gmail.com"}
]
license = {text = "To Kill"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core, deduplicated, modern dependencies for all agents and services
    "APScheduler",
    "Babel>=2.8.0",
    "Flask>=3.1.0",
    "GitPython",
    "Jinja2>=3.1.6",
    "PyJWT>=2.3.0",
    "PyNaCl>=1.5.0",
    "PyYAML>=6.0,<7.0",
    "Werkzeug>=3.1.3",
    "aiohttp",
    "ansible-core>=2.12.0",
    "anyio>=4.9.0",
    "black",
    "docker>=7.1.0",
    "fastapi",
    "flake8",
    "google-auth>=2.39.0",
    "gunicorn",
    "httpx>=0.20.0,<0.28.0",
    "importlib-metadata>=4.6.4",
    "langchain",
    "llama-cpp-python",
    "numpy>=2.2.5",
    "ollama",
    "openai",
    "pandas",
    "paramiko",
    "pillow>=11.2.1",
    "pluggy>=1.5.0",
    "protobuf>=3.12.4",
    "psutil>=7.0.0",
    "pydantic>=2.11.4",
    "pytest>=8.3.5",
    "python-dotenv>=0.19.2",
    "requests>=2.32.3",
    "rich>=13.0.0,<14.0.0",
    "scipy>=1.8.0",
    "starlette",
    "textual>=0.1.18",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "typer>=0.15.3",
    "uvicorn[standard]",
    "uvloop",
    "websockets>=15.0.1",
    "xonsh>=0.19.3",
    "pydantic-settings (>=2.9.1,<3.0.0)"
]

[tool.poetry]
# No custom packages needed for monorepo root

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
