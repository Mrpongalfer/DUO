name: omi_mobile_app
description: Omnitide Mobile Interface (OMI) - Secure Pocket Nexus for LCSAF
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  provider: ^6.1.2
  pointycastle: ^3.7.3
  encrypt: ^5.0.1
  device_info_plus: ^10.1.0
  flutter_certificate_manager: ^1.0.0
  flutter_ssl_pinning: ^2.1.0
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_highlight: ^0.8.3
  charts_flutter: ^0.12.0
  file_picker: ^6.1.1
  flutter_keyboard_visibility: ^6.0.0
  flutter_obfuscate: ^1.0.0
  flutter_jailbreak_detection: ^1.10.0
  ota_update: ^4.0.0
  flutter_biometrics: ^1.0.0
  flutter_markdown: ^0.6.17
  clipboard: ^0.1.3
  encrypt_storage: ^1.0.0
  flutter_logs: ^2.0.6
  flutter_cache_manager: ^3.3.1
  flutter_launcher_icons: ^0.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
flutter:
