apiVersion: apps/v1
kind: Deployment
metadata:
  name: oapdvas-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oapdvas-service
  template:
    metadata:
      labels:
        app: oapdvas-service
    spec:
      containers:
        - name: oapdvas-service
          image: oapdvas-image:latest  # REPLACE with your actual image name
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-uri
            - name: ARCHITECT_DIGITAL_VAULT
              valueFrom:
                secretKeyRef:
                  name: architect-vault-secret
                  key: wallet-address
            - name: OAPDVAS_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oapdvas-config
                  key: oapdvas_log_level
            - name: CPDDIAP_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oapdvas-config
                  key: cpddiap_log_level
            - name: CIAS_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oapdvas-config
                  key: cias_log_level
            - name: ADRGO_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oapdvas-config
                  key: adrgo_log_level
            - name: HRVO_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oapdvas-config
                  key: hrvo_log_level
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oapdvas-service
spec:
  type: NodePort
  selector:
    app: oapdvas-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 31080
